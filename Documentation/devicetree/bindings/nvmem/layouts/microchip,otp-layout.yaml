%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/layouts/microchip,otp-layout.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip OTP layout

maintainers:
  - Robert Marko <robert.marko@sartura.hr>

properties:
  compatible:
    const: microchip,otp-layout

  partid:
    type: object
    additionalProperties: false

  feat-ids:
    type: object
    additionalProperties: false

  serial-number:
    type: object
    additionalProperties: false

  password:
    type: object
    additionalProperties: false

  pcb:
    type: object
    additionalProperties: false

  revision:
    type: object
    additionalProperties: false

  base-mac-address:
    type: object
    description:
      Base MAC address for all on-module network interfaces. The first
      argument of the phandle will be treated as an offset.

    properties:
      "#nvmem-cell-cells":
        const: 1

    additionalProperties: false

  mac-address-count:
    type: object
    additionalProperties: false

  fit-config:
    type: object
    additionalProperties: false

  pcb2:
    type: object
    additionalProperties: false

required:
  - compatible

additionalProperties: false
