%YAML 1.2
---
$id: http://devicetree.org/schemas/net/maxlinear,gpy2xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MaxLinear GPY2xx PHY

maintainers:
  - Andrew Lunn <andrew@lunn.ch>
  - Michael Walle <michael@walle.cc>

select:
  properties:
    compatible:
      contains:
        const: ethernet-phy-idc133.5400
  required:
    - compatible

allOf:
  - $ref: ethernet-phy.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: ethernet-phy-idc133.5400
      required:
        - compatible

    then:
      required:
        - vddp-supply

    else:
      properties:
        vddp-supply: false
        maxlinear,lane-asp-map: false

properties:
  vddp-supply:
    description: |
      Regulator supplying the VDDP pin. Its voltage configures the MDIO,
      MDC, and MDINT pad voltage and must be either 1.8 V or 3.3 V.

  maxlinear,lane-asp-map:
    description: |
      Mapping of physical TPI lanes A through D to analog front ends (ASPs)
      A through D. The array index identifies the physical TPI lane, while
      its value identifies the analog front end, encoded as 0 through 3.
      Each analog front end must be mapped exactly once. Omit the property to
      retain the hardware reset mapping.
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    uniqueItems: true
    items:
      minimum: 0
      maximum: 3

  maxlinear,use-broken-interrupts:
    description: |
      Interrupts are broken on some GPY2xx PHYs in that they keep the
      interrupt line asserted for a random amount of time even after the
      interrupt status register is cleared. Thus it is blocking the
      interrupt line which is usually bad for shared lines. By default,
      interrupts are disabled for this PHY and polling mode is used. If one
      can live with the consequences, this property can be used to enable
      interrupt handling.

      Affected PHYs (as far as known) are GPY215B and GPY215C.
    type: boolean

dependencies:
  maxlinear,use-broken-interrupts: [ interrupts ]

unevaluatedProperties: false

examples:
  - |
    ethernet {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
            reg = <0>;
            interrupts-extended = <&intc 0>;
            maxlinear,use-broken-interrupts;
        };
    };

  - |
    vddp: regulator-vddp {
        compatible = "regulator-fixed";
        regulator-name = "vddp";
        regulator-min-microvolt = <1800000>;
        regulator-max-microvolt = <1800000>;
    };

    ethernet {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
            compatible = "ethernet-phy-idc133.5400",
                         "ethernet-phy-ieee802.3-c45";
            reg = <0>;
            vddp-supply = <&vddp>;

            /* Swap physical TPI lanes C and D. */
            maxlinear,lane-asp-map = <0 1 3 2>;

        };
    };

...
