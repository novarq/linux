%YAML 1.2
---
$id: http://devicetree.org/schemas/net/maxlinear,gpy2xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MaxLinear GPY2xx PHY

maintainers:
  - Andrew Lunn <andrew@lunn.ch>
  - Michael Walle <michael@walle.cc>

select:
  anyOf:
    - properties:
        compatible:
          contains:
            const: ethernet-phy-idc133.5400
      required:
        - compatible
    - required:
        - maxlinear,use-broken-interrupts

allOf:
  - $ref: ethernet-phy.yaml#
  - if:
      not:
        properties:
          compatible:
            contains:
              const: ethernet-phy-idc133.5400
        required:
          - compatible
    then:
      properties:
        vddp-supply: false

properties:
  vddp-supply:
    description: |
      Optional regulator supplying the VDDP pin. Its voltage configures the
      MDIO, MDC, and MDINT pad voltage and must be either 1.8 V or 3.3 V.

  maxlinear,use-broken-interrupts:
    description: |
      Interrupts are broken on some GPY2xx PHYs in that they keep the
      interrupt line asserted for a random amount of time even after the
      interrupt status register is cleared. Thus it is blocking the
      interrupt line which is usually bad for shared lines. By default,
      interrupts are disabled for this PHY and polling mode is used. If one
      can live with the consequences, this property can be used to enable
      interrupt handling.

      Affected PHYs (as far as known) are GPY215B and GPY215C.
    type: boolean

dependencies:
  maxlinear,use-broken-interrupts: [ interrupts ]

unevaluatedProperties: false

examples:
  - |
    ethernet {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
            reg = <0>;
            interrupts-extended = <&intc 0>;
            maxlinear,use-broken-interrupts;
        };
    };

  - |
    vddp: regulator-vddp {
        compatible = "regulator-fixed";
        regulator-name = "vddp";
        regulator-min-microvolt = <1800000>;
        regulator-max-microvolt = <1800000>;
    };

    ethernet {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
            compatible = "ethernet-phy-idc133.5400",
                         "ethernet-phy-ieee802.3-c45";
            reg = <0>;
            vddp-supply = <&vddp>;

        };
    };

...
