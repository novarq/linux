%YAML 1.2
---
$id: http://devicetree.org/schemas/hwmon/microchip,sparx5-temp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip Sparx5 Hardware Monitor

maintainers:
  - Lars Povlsen <lars.povlsen@microchip.com>

description: |
  Microchip Sparx5 embedded temperature monitor. On LAN969x, the hardware
  monitor also contains a PWM fan controller with a tachometer input.

properties:
  compatible:
    oneOf:
      - const: microchip,sparx5-temp
      - items:
          - enum:
              - microchip,lan9691-hwmon
              - microchip,lan9691-temp
          - const: microchip,sparx5-temp

  reg:
    minItems: 1
    maxItems: 2

  reg-names:
    minItems: 1
    items:
      - const: temp
      - const: fan

  clocks:
    items:
      - description: System reference clock

  '#thermal-sensor-cells':
    const: 0

  '#pwm-cells':
    const: 2
    description: |
      Number of cells in a PWM specifier.
      - cell 0: PWM period in nanoseconds
      - cell 1: PWM polarity: 0 or PWM_POLARITY_INVERTED

  fan:
    $ref: fan-common.yaml#
    unevaluatedProperties: false

    properties:
      cooling-levels:
        description:
          PWM duty-cycle values corresponding to thermal cooling states.
        items:
          maximum: 255

      pulses-per-revolution:
        minimum: 1
        maximum: 4
        default: 2

    required:
      - pwms

    dependencies:
      '#cooling-cells':
        - cooling-levels
      cooling-levels:
        - '#cooling-cells'

required:
  - compatible
  - reg
  - clocks

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: microchip,lan9691-hwmon
    then:
      properties:
        reg:
          minItems: 2
        reg-names:
          minItems: 2
      required:
        - '#pwm-cells'
        - reg-names
    else:
      properties:
        '#pwm-cells': false
        fan: false
        reg:
          maxItems: 1
        reg-names:
          maxItems: 1

additionalProperties: false

examples:
  - |
    tmon0: tmon@610508110 {
        compatible = "microchip,sparx5-temp";
        reg = <0x10508110 0xc>;
        #thermal-sensor-cells = <0>;
        clocks = <&sys_clk>;
    };

  - |
    #include <dt-bindings/pwm/pwm.h>

    hwmon: hwmon@e2020100 {
        compatible = "microchip,lan9691-hwmon", "microchip,sparx5-temp";
        reg = <0xe2020100 0xc>, <0xe2010348 0xc>;
        reg-names = "temp", "fan";
        #pwm-cells = <2>;
        #thermal-sensor-cells = <0>;
        clocks = <&sys_clk>;

        fan {
            pwms = <&hwmon 40000 PWM_POLARITY_INVERTED>;
            cooling-levels = <0 128 192 255>;
            #cooling-cells = <2>;
        };
    };
